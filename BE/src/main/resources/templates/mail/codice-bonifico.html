<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<body>

<th:block th:fragment="contenuto">

  <h1 style="margin:0 0 12px 0; font-family:Arial,sans-serif; font-size:22px;
             font-weight:bold; color:#0f1729;">
    Conferma il tuo bonifico
  </h1>

  <p style="margin:0 0 20px 0;">
    Hai richiesto un bonifico di
    <strong style="color:#0f1729;" th:text="${importo}">0,00 €</strong>
    verso <span style="font-family:'Courier New',monospace;" th:text="${destinatario}">IT…</span>.
  </p>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="margin:0 0 24px 0;">
    <tr>
      <td align="center"
          style="background-color:#f4f6fb; border:1px solid #dde3ee; border-radius:12px;
                 padding:22px 16px; font-family:'Courier New',monospace; font-size:32px;
                 font-weight:bold; letter-spacing:8px; color:#0f1729;"
          th:text="${codice}">000000</td>
    </tr>
  </table>

  <!-- Avviso di sicurezza: bordo colorato a sinistra, tecnica che regge ovunque -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td style="background-color:#fdf3e2; border-left:4px solid #9a6a00; border-radius:4px;
                 padding:12px 16px; font-family:Arial,sans-serif; font-size:13px;
                 line-height:1.5; color:#7a5500;">
        Non condividere questo codice con nessuno. Nexa Bank non te lo chiederà mai
        per telefono o via email. Se non hai disposto tu questo bonifico, non inserire
        il codice: la transazione scadrà da sola tra 10 minuti.
      </td>
    </tr>
  </table>

</th:block>

</body>
</html>
