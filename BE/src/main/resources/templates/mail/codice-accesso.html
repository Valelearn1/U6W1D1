<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<body>

<th:block th:fragment="contenuto">

  <h1 style="margin:0 0 12px 0; font-family:Arial,sans-serif; font-size:22px;
             font-weight:bold; color:#0f1729;">
    Il tuo codice di accesso
  </h1>

  <p style="margin:0 0 20px 0;">
    Usa questo codice per entrare nel tuo conto Nexa Bank.
  </p>

  <!-- Il codice grande e spaziato: si legge bene anche da telefono -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="margin:0 0 24px 0;">
    <tr>
      <td align="center"
          style="background-color:#f4f6fb; border:1px solid #dde3ee; border-radius:12px;
                 padding:22px 16px; font-family:'Courier New',monospace; font-size:32px;
                 font-weight:bold; letter-spacing:8px; color:#0f1729;"
          th:text="${codice}">000000</td>
    </tr>
  </table>

  <p style="margin:0; font-size:13px; color:#8a93a8;">
    Il codice scade tra 10 minuti e può essere usato una sola volta.
    Se non hai richiesto tu l'accesso, ignora questo messaggio e valuta di cambiare la password.
  </p>

</th:block>

</body>
</html>
