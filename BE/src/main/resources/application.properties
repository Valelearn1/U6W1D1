spring.application.name=demo

# === Database (PostgreSQL) ===
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# update: crea/aggiorna le tabelle automaticamente all'avvio, comodo in sviluppo.
# Da NON usare in produzione (li' servono le migration, es. Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true

# === Template email (Thymeleaf) ===
# Cache disattivata in sviluppo: modificando un file in templates/mail/
# il cambiamento ha effetto subito, senza riavviare l'applicazione.
# In produzione va rimessa a true (è il default) per non rileggere i file a ogni invio.
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# === Frontend ===
# Usato per costruire il link di verifica nella mail di registrazione
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# === Sicurezza (JWT) ===
# JWT_SECRET va sempre impostato in .env con un valore tuo: quello di default
# qui sotto e' solo per non far crashare l'app se lo dimentichi, NON e' sicuro.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-key-please-override-via-JWT-SECRET-env-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# === Mail (Gmail SMTP) ===
# I valori arrivano dalle variabili d'ambiente definite in BE/.env
# La sintassi ${NOME} legge la variabile; dopo i due punti c'e' il valore di default
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Mittente usato dal servizio di invio
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
